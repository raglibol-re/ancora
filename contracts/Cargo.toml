# One crate per contract under contracts/<name>; shared test vectors live in contracts/test-vectors.
[workspace]
resolver = "2"
members = ["registry", "organization"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# soroban-sdk 28 matches OpenZeppelin stellar-contracts 0.8.0; the testnet runs protocol 29.
soroban-sdk = "=28.0.0"
stellar-access = "=0.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
