[package]
name = "ancora-deal"
description = "ancora Deals: milestone escrow between two parties (usually two ancora organizations), with an objection period, automatic payout and an optional arbiter. No admin: nobody else can move the money."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
