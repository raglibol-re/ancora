name: E2E

# The core path on the real Stellar testnet with a virtual passkey, against production. Nightly
# and by hand; not on every push, because each run creates a pass and an organization whose
# fees the operator sponsors.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  core-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_BASE_URL: https://ancora-gray.vercel.app
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14
